# The reports' own health check, through nginx.
# health: /health
server {
    listen 443 ssl;
    http2 on;
    server_name reports.kingcountysar.org;

    ssl_certificate /etc/letsencrypt/live/reports.kingcountysar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.kingcountysar.org/privkey.pem;

    include /etc/kcsara-nginx/reports.inc;
}
