# Hydra's readiness check, through nginx: health checks ask for it instead of / (a 404 from Hydra).
# health: /health/ready
server {
    listen 443 ssl;
    http2 on;
    server_name jwt.kingcountysar.org;

    ssl_certificate /etc/letsencrypt/live/jwt.kingcountysar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jwt.kingcountysar.org/privkey.pem;

    include /etc/kcsara-nginx/hydra.inc;
}
