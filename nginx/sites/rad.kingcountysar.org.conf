# The RAD portal's own health check, through nginx.
# health: /health
server {
    listen 443 ssl;
    http2 on;
    server_name rad.kingcountysar.org;

    ssl_certificate /etc/letsencrypt/live/rad.kingcountysar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rad.kingcountysar.org/privkey.pem;

    include /etc/kcsara-nginx/rad.inc;
}
