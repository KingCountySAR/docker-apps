# cedar's own health check, through nginx.
# health: /health
server {
    listen 443 ssl;
    http2 on;
    server_name cedar.kingcountysar.org;

    ssl_certificate /etc/letsencrypt/live/cedar.kingcountysar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cedar.kingcountysar.org/privkey.pem;

    include /etc/kcsara-nginx/cedar.inc;
}
