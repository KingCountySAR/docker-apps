# Always loaded. Port 80 answers Let's Encrypt's checks and sends everything else to https. The sites themselves are
# in sites/, one file per host name; run.sh loads each one once it has a certificate.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# https for a host name with no site here (or no certificate yet): refuse, rather than answer with another site's
# certificate.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# Looks up the containers when a request comes in, so nginx still starts while one is down or restarting.
resolver 127.0.0.11 valid=10s;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
