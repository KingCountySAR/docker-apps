# nginx's main configuration: the image's own, but logging each request as one line of JSON, with the site that
# answered it. Alloy (monitoring/alloy/config.alloy) reads these lines from the container's log and counts them into
# per-site metrics. run.sh copies this over /etc/nginx/nginx.conf.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # site is the server_name of the site that answered (_ for none), not the Host the client sent, so made-up host
    # names don't each become a site. upstream_time is "-" when nothing was proxied, and has several values (comma
    # separated) when nginx retried.
    log_format  site_json  escape=json
        '{"time":"$time_iso8601","site":"$server_name","host":"$host","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time","agent":"$http_user_agent"}';

    # The image links this to the container's standard output.
    access_log  /var/log/nginx/access.log  site_json;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
