# Health checks blackbox-exporter can run, for Prometheus's sites and services jobs (prometheus/prometheus.yml).
modules:
  # A site is up if it answers over https with a valid certificate, with anything but a server error: a site's front
  # page can be a redirect, a sign-in, or (for Hydra) a 404.
  site:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 201, 204, 301, 302, 303, 307, 308, 401, 403, 404]
      fail_if_not_ssl: true
      follow_redirects: false
      preferred_ip_protocol: ip4

  # A service's own health check address: up only on a 2xx.
  healthy:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
