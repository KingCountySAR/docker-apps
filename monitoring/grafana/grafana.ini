; Grafana's settings (https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/). Secrets aren't here:
; config/grafana.env on the VM has the admin password and the Google sign-in client, as GF_<SECTION>_<KEY> variables,
; which override this file.

[server]
; Only through `node grafana.mjs` (an ssh tunnel) for now. When Grafana gets a public site, this becomes its https
; address, and Google's OAuth client gets <that address>/login/google too.
http_port = 3000
root_url = http://localhost:3030/

[security]
admin_user = admin
cookie_samesite = lax
disable_gravatar = true

[users]
allow_sign_up = false
; People signing in with Google for the first time can look at dashboards; an admin gives them more.
auto_assign_org_role = Viewer

[auth]
; With Google sign-in on, the password form can go (keep the admin login for emergencies: /login?disableAutoLogin).
disable_login_form = false

[auth.google]
; Off until config/grafana.env has GF_AUTH_GOOGLE_ENABLED=true and the client (see the README).
enabled = false
allow_sign_up = true
auto_login = false
scopes = openid email profile
use_pkce = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[unified_alerting]
enabled = true
