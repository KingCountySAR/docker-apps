# Grafana's alert rules, set up on start (https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/).
# Where alerts go is a contact point: none is set up yet, so they show in Grafana (Alerting → Alert rules) but aren't
# sent anywhere. See "Alerts" in the README.
#
# Each rule is a Prometheus query (A) and a threshold on it (B); the rule fires for each series past the threshold
# for longer than `for`.
apiVersion: 1

groups:
  - orgId: 1
    name: kcsara
    folder: KCSARA
    interval: 1m
    rules:
      - uid: site-down
        title: Site down
        condition: B
        data:
          # Down now, and was up at some point in the last week: a site still waiting for its DNS doesn't count.
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: (1 - probe_success{job="sites"}) and on (instance) max_over_time(probe_success{job="sites"}[7d]) == 1
          - &above-zero
            refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} isn't answering over https"
          description: Checked from the VM. See the Health dashboard, and `node deploy.mjs logs caddy`.

      - uid: service-unhealthy
        title: Service unhealthy
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: 1 - probe_success{job="services"}
          - *above-zero
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }}'s health check is failing"
          description: "{{ $labels.instance }}. See `node deploy.mjs logs {{ $labels.service }}`."

      - uid: target-down
        title: Not collecting from a service
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: 1 - up{job!~"sites|services"}
          - *above-zero
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Prometheus can't reach {{ $labels.job }} ({{ $labels.instance }})"
          description: The service may be down, or its metrics endpoint is. `node deploy.mjs status` shows what's running.

      - uid: site-errors
        title: Site returning server errors
        condition: B
        data:
          # The share of a site's requests answered with 5xx over 5 minutes, for sites with at least a few a minute.
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: |
                (
                  sum by (site) (rate(loki_process_custom_site_requests_total{status=~"5.."}[5m]))
                  / sum by (site) (rate(loki_process_custom_site_requests_total[5m]))
                ) and on (site) sum by (site) (rate(loki_process_custom_site_requests_total[5m])) > 0.05
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.site }}: {{ humanizePercentage $values.A.Value }} of requests are server errors"
          description: See the Sites dashboard, and the app's log.

      - uid: certificate-expiring
        title: Certificate expiring
        condition: B
        data:
          # Days left. Caddy renews at 30, so under 14 means renewing has been failing.
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: (probe_ssl_earliest_cert_expiry{job="sites"} - time()) / 86400
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [14] } }]
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}'s certificate expires in {{ humanize $values.A.Value }} days"
          description: Caddy should have renewed it by now. See `node deploy.mjs logs caddy`.

      - uid: disk-full
        title: Disk nearly full
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: 100 * node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [10] } }]
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.mountpoint }} has {{ humanize $values.A.Value }}% free"

      - uid: backup-late
        title: Backup late
        condition: B
        data:
          # Hours since the last backup to Azure that succeeded. Before the first, there's nothing: that alerts too.
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: (time() - max(kcsara_backup_last_success_timestamp_seconds)) / 3600
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [48] } }]
        for: 1h
        noDataState: Alerting
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: No backup to Azure has succeeded in the last 2 days
          description: See `node deploy.mjs logs backup`, and "Backups" in the README.

      - uid: memory-low
        title: Memory low
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [10] } }]
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "The VM has {{ humanize $values.A.Value }}% of its memory available"
          description: The Containers dashboard shows which service is using it.

      - uid: cpu-busy
        title: CPU busy
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [90] } }]
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "The VM's CPU has been {{ humanize $values.A.Value }}% busy for half an hour"
          description: The Containers dashboard shows which service is using it.
