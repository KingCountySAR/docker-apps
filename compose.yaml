# Production stack on the VM, in /srv/kcsara. Copied there by `node deploy.mjs vm`. What the apps share: postgres,
# Hydra (sign-in tokens), Caddy (the way in) and monitoring. The apps themselves (RAD, cedar, reports, Respond) each
# bring their own compose.yaml, in apps/<name>/ (see "Apps" in the README).
# Configuration and data stay on the VM:
#   config/*.env            environment for each service. bin/secrets.sh makes postgres.env and hydra.env; the
#                           others start from config/*.env.example
#   data/postgres/          the shared postgres: a database (and user) for each app
#   data/caddy/             Caddy's certificates (from Let's Encrypt) and ACME account
# Only Caddy is reachable from outside, on ports 80 and 443. Hydra's admin API (4445) has no authentication of its
# own: it's only on this network and the VM's loopback address, never through Caddy.
#
# A service with a site has caddy labels (see caddy/Caddyfile): its host names, and where Caddy passes requests.
# Hydra's can be changed without changing this file, as HYDRA_HOSTS in .env next to it (see "Testing under another
# name" in the README).
name: kcsara

# Profiles choose what runs besides the core here (postgres, hydra, caddy), which always does: `monitoring`, also in
# `full`. On the VM, COMPOSE_PROFILES in .env picks them for every docker compose command there: `full` unless changed
# (see "Choosing what runs" in the README).

# Prometheus, Grafana and what they collect from: profiles full and monitoring.
include:
  - path: monitoring/compose.yaml
    project_directory: .

services:
  # Shared by the apps: each has its own database and user, made by bin/app-database.sh (Hydra's by hydra-db).
  # On this network (postgres:5432), and the VM's loopback address, never outside.
  # As the superuser: `docker compose exec postgres psql -U postgres` on the VM.
  postgres:
    image: &postgres-image postgres:17-alpine
    # POSTGRES_PASSWORD, the superuser's
    env_file: ./config/postgres.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # Only on the VM's own loopback address: `node db.mjs --tunnel` reaches it from your machine through ssh, for
    # one-off jobs run from a dev machine (like db-reporting's legacy import).
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Makes sure Hydra's database and user exist, from its DSN, then exits; see postgres/create-database.sh.
  hydra-db:
    image: *postgres-image
    # Hydra's env file first, so postgres.env's POSTGRES_PASSWORD wins if Hydra's has one too.
    env_file: [./config/hydra.env, ./config/postgres.env]
    environment:
      DATABASE_URL_FROM: DSN
    volumes:
      - ./postgres:/scripts:ro
    command: ["sh", "/scripts/create-database.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  # Brings Hydra's database up to date, then exits; hydra waits for it. Runs again on every `docker compose up`, which
  # does nothing when there's nothing to do.
  hydra-migrate:
    image: &hydra-image oryd/hydra:v2.3.0
    env_file: ./config/hydra.env
    volumes: &hydra-config
      - ./hydra:/etc/config/hydra:ro
    command: ["migrate", "-c", "/etc/config/hydra/hydra.yml", "sql", "up", "-e", "--yes"]
    depends_on:
      hydra-db: { condition: service_completed_successfully }
    restart: on-failure

  hydra:
    image: *hydra-image
    # DSN and SECRETS_SYSTEM; everything else is in hydra/hydra.yml
    env_file: ./config/hydra.env
    volumes: *hydra-config
    command: ["serve", "all", "-c", "/etc/config/hydra/hydra.yml"]
    # The admin API, only on the VM's own loopback address (for `node hydra.mjs` and anything else run on the VM).
    ports:
      - "127.0.0.1:4445:4445"
    # Only the public API (4444) is a site.
    labels:
      caddy: ${HYDRA_HOSTS:-jwt.kingcountysar.org}
      caddy.import: site
      caddy.reverse_proxy: hydra:4444
      kcsara.health: /health/ready
    depends_on:
      hydra-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # The way in from outside, on ports 80 and 443 (and 443 over UDP, for HTTP/3): caddy-docker-proxy, Caddy built
  # with a plugin that makes each site from the labels on the containers (see caddy/Caddyfile). It watches Docker, so a
  # container that starts or stops with caddy labels changes the sites within seconds, from any compose project on the
  # kcsara network. Docker's socket is mounted read-only, but anything with it can use all of Docker's API.
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
    # ACME_EMAIL, for Let's Encrypt's expiry warnings
    env_file: ./config/caddy.env
    environment:
      CADDY_DOCKER_CADDYFILE_PATH: /etc/kcsara-caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/kcsara-caddy:ro
      - ./data/caddy:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  # A fixed name, so other compose projects on the VM can join with `networks: { default: { name: kcsara, external: true } }`
  # and reach Hydra (http://hydra:4444 public, http://hydra:4445 admin) by service name. A container there with caddy
  # labels is a site.
  default:
    name: kcsara
