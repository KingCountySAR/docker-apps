# Production stack on the VM, in /srv/kcsara. Copied there by `node deploy.mjs vm`.
# Configuration and data stay on the VM:
#   config/*.env            environment for each service. bin/secrets.sh makes postgres.env and hydra.env; the
#                           others start from config/*.env.example
#   data/postgres/          the shared postgres: a database (and user) for each app
#   data/letsencrypt/       Let's Encrypt certificates, got and renewed by the certbot service
#   data/acme-challenge/    certbot's answers to Let's Encrypt's checks, served by nginx on port 80
# Only nginx is reachable from outside, on ports 80 and 443. Hydra's admin API (4445) has no authentication of its
# own: it's only on this network and the VM's loopback address, never through nginx.
name: kcsara

# Profiles choose what runs besides the core here (postgres, hydra, nginx, certbot), which always does. Each optional
# part is in `full` and in its own profile (`monitoring`, ...). On the VM, COMPOSE_PROFILES in .env picks them for every
# docker compose command there: `full` unless changed (see "Choosing what runs" in the README).

# Prometheus, Grafana and what they collect from: profiles full and monitoring.
include:
  - path: monitoring/compose.yaml
    project_directory: .

services:
  # Shared by the apps: each has its own database and user, made by its <app>-db service. Only on this network
  # (postgres:5432), not published. As the superuser: `docker compose exec postgres psql -U postgres` on the VM.
  postgres:
    image: &postgres-image postgres:17-alpine
    # POSTGRES_PASSWORD, the superuser's
    env_file: ./config/postgres.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Makes sure Hydra's database and user exist, from its DSN, then exits. Each app that uses postgres has one of these
  # (copy this one); see postgres/create-database.sh.
  hydra-db:
    image: *postgres-image
    # The app's env file first, so postgres.env's POSTGRES_PASSWORD wins if the app's has one too.
    env_file: [./config/hydra.env, ./config/postgres.env]
    environment:
      DATABASE_URL_FROM: DSN
    volumes:
      - ./postgres:/scripts:ro
    command: ["sh", "/scripts/create-database.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  # Brings Hydra's database up to date, then exits; hydra waits for it. Runs again on every `docker compose up`, which
  # does nothing when there's nothing to do.
  hydra-migrate:
    image: &hydra-image oryd/hydra:v2.3.0
    env_file: ./config/hydra.env
    volumes: &hydra-config
      - ./hydra:/etc/config/hydra:ro
    command: ["migrate", "-c", "/etc/config/hydra/hydra.yml", "sql", "up", "-e", "--yes"]
    depends_on:
      hydra-db: { condition: service_completed_successfully }
    restart: on-failure

  hydra:
    image: *hydra-image
    # DSN and SECRETS_SYSTEM; everything else is in hydra/hydra.yml
    env_file: ./config/hydra.env
    volumes: *hydra-config
    command: ["serve", "all", "-c", "/etc/config/hydra/hydra.yml"]
    # The admin API, only on the VM's own loopback address (for `node hydra.mjs` and anything else run on the VM).
    ports:
      - "127.0.0.1:4445:4445"
    depends_on:
      hydra-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # The RAD portal (profiles full and rad), at rad.kingcountysar.org: one file, apps/rad/rad-portal.mjs, built by
  # `npm run build` in the rad-portal repo and copied here by `node deploy.mjs rad`. Its MongoDB is in Atlas
  # (MONGODB_URI in config/rad.env).
  rad:
    image: node:22-alpine
    profiles: [full, rad]
    env_file: ./config/rad.env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Members' D4H qualifications come from cedar, with a client_credentials token from Hydra (its client is
      # CEDAR_CLIENT_ID and CEDAR_CLIENT_SECRET in config/rad.env). Both straight over this network, not the internet:
      # the portal only uses JWT_ISSUER for the token address (<issuer>oauth2/token).
      JWT_ISSUER: http://hydra:4444/
      CEDAR_URL: http://cedar:3040
    volumes:
      - ./apps/rad:/app:ro
    working_dir: /app
    user: node
    # Waits for the first `node deploy.mjs rad`, rather than failing over and over without its file.
    command: ["sh", "-c", "until [ -f rad-portal.mjs ]; do sleep 10; done; exec node --enable-source-maps rad-portal.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped
    init: true

  # cedar (profiles full and cedar), at cedar.kingcountysar.org: an API in front of other KCSARA systems (D4H, ...),
  # for clients with tokens from Hydra. One file, apps/cedar/cedar.mjs, built by `npm run build` in the cedar repo and
  # copied here by `node deploy.mjs cedar`. Settings and its D4H token are in config/cedar.env.
  cedar:
    image: node:22-alpine
    profiles: [full, cedar]
    env_file: ./config/cedar.env
    environment:
      NODE_ENV: production
      PORT: 3040
      # Hydra's keys, straight from Hydra on this network rather than through the internet and nginx. Tokens must still
      # name JWT_ISSUER (in config/cedar.env).
      JWT_URL: http://hydra:4444/
    volumes:
      - ./apps/cedar:/app:ro
    working_dir: /app
    user: node
    # Waits for the first `node deploy.mjs cedar`, rather than failing over and over without its file.
    command: ["sh", "-c", "until [ -f cedar.mjs ]; do sleep 10; done; exec node --enable-source-maps cedar.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3040/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped
    init: true

  # Makes sure the reports' database and user exist, from DATABASE_URL in config/reports-db.env (made by bin/secrets.sh),
  # then exits.
  reports-db:
    image: *postgres-image
    profiles: [full, reports]
    env_file: [./config/reports-db.env, ./config/postgres.env]
    environment:
      DATABASE_URL_FROM: DATABASE_URL
    volumes:
      - ./postgres:/scripts:ro
    command: ["sh", "/scripts/create-database.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  # KCSARA Reports (profiles full and reports), at reports.kingcountysar.org: one file, apps/reports/db-reporting.mjs,
  # built by `npm run build` in the db-reporting repo and copied here by `node deploy.mjs reports`. Its data is in the
  # shared postgres (the reporting database), loaded from D4H by reports-etl.
  reports:
    image: node:22-alpine
    profiles: [full, reports]
    env_file: &reports-env [./config/reports-db.env, ./config/reports.env]
    environment: &reports-environment
      NODE_ENV: production
      PORT: 3000
      # D4H comes from cedar, with a client_credentials token from Hydra (its client is CEDAR_CLIENT_ID and
      # CEDAR_CLIENT_SECRET in config/reports.env). Both straight over this network: the app only uses JWT_ISSUER for
      # the token address (<issuer>oauth2/token).
      JWT_ISSUER: http://hydra:4444/
      CEDAR_URL: http://cedar:3040
    volumes: &reports-volumes
      - ./apps/reports:/app:ro
    working_dir: /app
    user: node
    # Waits for the first `node deploy.mjs reports`, rather than failing over and over without its file.
    command: ["sh", "-c", "until [ -f db-reporting.mjs ]; do sleep 10; done; exec node --enable-source-maps db-reporting.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      reports-db: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true

  # The reports' D4H sync, through cedar: the same file, run as `node db-reporting.mjs etl` every night at 10:00 UTC
  # (2 or 3 in the morning in Seattle). To run it now: `docker compose exec reports-etl node db-reporting.mjs etl` on the
  # VM (add --force when D4H has far fewer records than last time).
  reports-etl:
    image: node:22-alpine
    profiles: [full, reports]
    env_file: *reports-env
    environment: *reports-environment
    volumes: *reports-volumes
    working_dir: /app
    user: node
    command:
      - sh
      - -c
      - >-
        while true;
        do next=$$(date -u -d "$$(date -u +%Y-%m-%d) 10:00:00" +%s); now=$$(date -u +%s);
        [ "$$next" -gt "$$now" ] || next=$$((next + 86400)); sleep $$((next - now));
        [ ! -f db-reporting.mjs ] || node --enable-source-maps db-reporting.mjs etl;
        done
    depends_on:
      reports-db: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true

  # Makes sure Respond's database and user exist, from DATABASE_URL in config/respond-db.env (made by bin/secrets.sh),
  # then exits.
  respond-db:
    image: *postgres-image
    profiles: [full, respond]
    env_file: [./config/respond-db.env, ./config/postgres.env]
    environment:
      DATABASE_URL_FROM: DATABASE_URL
    volumes:
      - ./postgres:/scripts:ro
    command: ["sh", "/scripts/create-database.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  # Respond (profiles full and respond): the respond-sync (Mission Sync) repo's build, a folder rather than one file:
  # apps/respond/current/ holds index.mjs (the server), public/ (the UI it serves), seed.mjs and import-legacy.mjs, copied there by
  # `node deploy.mjs respond`. Each organization's site is a host name in nginx/sites/ (see nginx/respond.inc); the
  # app tells them apart by host name. Its data, and the organizations, are in the shared postgres (respond database).
  respond:
    image: node:22-alpine
    profiles: [full, respond]
    # DATABASE_URL and SECRETS_KEY (made by bin/secrets.sh), then SITE_ADMINS and such
    env_file: [./config/respond-db.env, ./config/respond.env]
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      - ./apps/respond:/app:ro
    working_dir: /app
    user: node
    # Waits for the first `node deploy.mjs respond`, rather than failing over and over without its files.
    command: ["sh", "-c", "until [ -f current/index.mjs ]; do sleep 10; done; cd current && exec node --enable-source-maps index.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      respond-db: { condition: service_completed_successfully }
    restart: unless-stopped
    init: true

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/kcsara-nginx:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/acme-challenge:/var/www/certbot:ro
    # Loads the sites in nginx/sites/ that have certificates, and reloads when certificates or configuration change.
    command: ["sh", "/etc/kcsara-nginx/run.sh"]
    restart: unless-stopped
    init: true

  certbot:
    image: certbot/certbot
    env_file: ./config/certbot.env
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/acme-challenge:/var/www/certbot
      - ./nginx:/etc/kcsara-nginx:ro
    # Gets certificates for the sites in nginx/sites/ and renews them; see nginx/certbot.sh.
    entrypoint: ["sh", "/etc/kcsara-nginx/certbot.sh"]
    depends_on: [nginx]
    restart: unless-stopped
    init: true

networks:
  # A fixed name, so other compose projects on the VM can join with `networks: { default: { name: kcsara, external: true } }`
  # and reach Hydra (http://hydra:4444 public, http://hydra:4445 admin) and nginx by service name.
  default:
    name: kcsara
